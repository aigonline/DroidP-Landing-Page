<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support & Help Center | Droip WordPress Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#6366f1', secondary: '#f43f5e' },
                    fontFamily: { sans: ['Inter', 'sans-serif'], heading: ['Outfit', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; color: #0f172a; }
        h1, h2, h3, h4, .font-heading { font-family: 'Outfit', sans-serif; }
        .gradient-text {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #f43f5e 100%);
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .btn-gradient { background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #f43f5e 100%); }
    </style>
</head>
<body class="antialiased bg-white text-slate-800">

    <!-- Header Navigation -->
    <header class="fixed w-full bg-white/90 backdrop-blur-md z-50 border-b border-slate-100 shadow-sm">
        <div class="container mx-auto px-4 lg:px-8 py-3.5 flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-2.5">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-rose-500 flex items-center justify-center shadow-md">
                    <i class="fas fa-cubes text-white text-lg"></i>
                </div>
                <span class="text-2xl font-bold font-heading gradient-text">Droip</span>
            </a>
            
            <nav class="hidden md:flex items-center space-x-7">
                <a href="index.html" class="text-slate-600 hover:text-primary font-medium transition">Home</a>
                <a href="editor.html" class="text-slate-600 hover:text-primary font-medium transition">Visual Editor</a>
                <a href="grids.html" class="text-slate-600 hover:text-primary font-medium transition">Grids & Layouts</a>
                <a href="typography.html" class="text-slate-600 hover:text-primary font-medium transition">Typography</a>
                <a href="seo.html" class="text-slate-600 hover:text-primary font-medium transition">SEO & Speed</a>
                <a href="pricing.html" class="text-slate-600 hover:text-primary font-medium transition">Pricing</a>
                <a href="support.html" class="text-slate-900 font-semibold hover:text-primary transition">Support</a>
            </nav>
            
            <div class="hidden md:flex items-center space-x-3">
                <a href="login.html" class="text-slate-700 hover:text-primary font-semibold px-4 py-2 transition">Sign In</a>
                <a href="get-started.html" class="btn-gradient text-white px-5 py-2.5 rounded-full font-medium text-sm">Get Started Free</a>
            </div>
        </div>
    </header>

    <!-- Hero -->
    <section class="pt-36 pb-16 px-4 bg-gradient-to-b from-slate-50 to-white text-center">
        <div class="container mx-auto max-w-4xl">
            <h1 class="text-4xl sm:text-5xl font-extrabold font-heading text-slate-900 mb-6">
                How can we <span class="gradient-text">help you build?</span>
            </h1>
            <p class="text-lg text-slate-600 max-w-2xl mx-auto mb-8">
                Our support team and community are available 24/7.
            </p>
        </div>
    </section>

    <!-- Contact Form Section -->
    <section class="pb-24 px-4 bg-white">
        <div class="container mx-auto max-w-3xl">
            <div class="bg-slate-50 p-8 sm:p-10 rounded-3xl border border-slate-200 shadow-sm">
                <h3 class="text-2xl font-bold font-heading text-slate-900 mb-6">Send Us a Message</h3>
                <form onsubmit="event.preventDefault(); alert('Message sent! Our support team will respond shortly.');" class="space-y-6">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Your Name</label>
                        <input type="text" required placeholder="Alex Morgan" class="w-full bg-white border border-slate-300 rounded-xl p-3.5 text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Work Email</label>
                        <input type="email" required placeholder="alex@company.com" class="w-full bg-white border border-slate-300 rounded-xl p-3.5 text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">How can we help?</label>
                        <textarea rows="4" required placeholder="Describe your question or issue..." class="w-full bg-white border border-slate-300 rounded-xl p-3.5 text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
                    </div>
                    <button type="submit" class="w-full btn-gradient text-white py-4 rounded-xl font-bold text-lg shadow-lg">Submit Ticket</button>
                </form>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-slate-900 text-white py-12 px-4 border-t border-slate-800">
        <div class="container mx-auto text-center text-slate-400 text-sm">
            <p>© 2026 Droip Technologies Inc. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
