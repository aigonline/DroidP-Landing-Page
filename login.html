<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Droip WordPress Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#6366f1', secondary: '#f43f5e' },
                    fontFamily: { sans: ['Inter', 'sans-serif'], heading: ['Outfit', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; }
        h1, h2, h3, h4, .font-heading { font-family: 'Outfit', sans-serif; }
        .gradient-text {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #f43f5e 100%);
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .btn-gradient { background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #f43f5e 100%); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center py-12 px-4">

    <div class="max-w-md w-full bg-white p-8 sm:p-10 rounded-3xl border border-slate-200 shadow-xl">
        <div class="text-center mb-8">
            <a href="index.html" class="inline-flex items-center space-x-2.5 mb-6">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-rose-500 flex items-center justify-center shadow-md">
                    <i class="fas fa-cubes text-white text-xl"></i>
                </div>
                <span class="text-3xl font-bold font-heading gradient-text">Droip</span>
            </a>
            <h2 class="text-2xl font-bold font-heading text-slate-900">Sign in to your account</h2>
            <p class="text-sm text-slate-500 mt-1">Welcome back! Please enter your details.</p>
        </div>

        <form onsubmit="event.preventDefault(); alert('Signed in successfully!'); window.location.href='index.html';" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">Email Address</label>
                <input type="email" required placeholder="you@example.com" class="w-full border border-slate-300 rounded-xl p-3 text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <div>
                <div class="flex justify-between items-center mb-1.5">
                    <label class="block text-sm font-semibold text-slate-700">Password</label>
                    <a href="#" class="text-xs font-semibold text-indigo-600 hover:underline">Forgot password?</a>
                </div>
                <input type="password" required placeholder="••••••••" class="w-full border border-slate-300 rounded-xl p-3 text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <button type="submit" class="w-full btn-gradient text-white py-3.5 rounded-xl font-bold text-base shadow-lg shadow-indigo-500/20">Sign In</button>
        </form>

        <div class="text-center mt-6 text-sm text-slate-600">
            Don't have an account? <a href="get-started.html" class="text-indigo-600 font-semibold hover:underline">Sign up for free</a>
        </div>
    </div>

</body>
</html>
